name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_COLOR: "1"

jobs:
  sherif:
    name: Lint monorepos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: QuiiBz/sherif@v1
        # with:
        # args: '--ignore-rule root-package-manager-field'

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install bun and disallow changes to lockfile
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun ci

      - name: Lint
        run: bun lint-typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun ci

      - name: Prepare env file
        env:
          HONO_ENV_FILE: ${{ secrets.HONO_ENV_FILE }}
        run: |
          if [ -n "$HONO_ENV_FILE" ]; then
            echo "$HONO_ENV_FILE" > apps/hono/.env.dev
          else
            cp apps/hono/.env.dev.example apps/hono/.env.dev
          fi

      # - name: Run vitest tests
      #   run: bun hono:test

      - name: Run vitest tests in shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        run: bun run hono test:ci
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}

      # - name: Save vitest report as artifact
      #   uses: actions/upload-artifact@v7
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: blob-report-${{ matrix.shardIndex }}
      #     path: apps/hono/.vitest-reports
      #     include-hidden-files: true
      #     retention-days: 1

