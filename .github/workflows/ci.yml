name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_COLOR: "1"

jobs:
  sherif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: QuiiBz/sherif@v1
        # with:
        # args: '--ignore-rule root-package-manager-field'

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  # PR-scoped dead code / complexity / duplication / styling gate (new-only).
  # https://docs.fallow.tools/cli/audit · https://docs.fallow.tools/integrations/ci
  fallow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Fallow all checks
        uses: fallow-rs/fallow@v3
        with:
          # command: audit
          # gate: new-only
          dupes-mode: semantic

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install bun and disallow changes to lockfile
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun ci

      - name: Lint and typecheck
        run: bun lint-typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun ci

      - name: Prepare env file
        env:
          HONO_ENV_FILE: ${{ secrets.HONO_ENV_FILE }}
        run: |
          if [ -n "$HONO_ENV_FILE" ]; then
            echo "$HONO_ENV_FILE" > apps/hono/.env.dev
          else
            cp apps/hono/.env.dev.example apps/hono/.env.dev
          fi

      - name: Run vitest tests with coverage
        run: bun run test:cov

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '```'
            cat coverage/vitest/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save coverage report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage-report
          path: coverage/vitest
          retention-days: 3
